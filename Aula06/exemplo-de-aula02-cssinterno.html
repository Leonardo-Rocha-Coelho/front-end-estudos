<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classes e CSS interno</title>
    <style>
        .titulo{
            color:blue;
            text-align:center;
        }

        .caixa01{
            background-color: rgb(75, 149, 209);
            border: 2PX solid black;
            padding: 20px;
            margin:20px;
        }

        .caixa02{
            background-color: rgb(114, 226, 226);
            border: 2PX solid rgb(255, 251, 251);
            padding: 20px;
            margin:20px;
        }

        .destaque01 {
            color:rgb(0, 0, 0);
            font-weight: bold;
        }

        .destaque02 {
            color:rgb(0, 0, 0);
            background-color: rgb(24, 127, 245) ;
            font-weight: bold;
            font-style: italic;
            padding: 10px;
        }

    </style>
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
<div class="caixa01">
    <p>
        Estou aprendendo a utilizar classes para personalizar os elementos de uma página.
    </p>
    <br>
    <p class="destaque01">
        Este parágrafo utiliza a classe destaque01
    </p>
    <p class="destaque02">
        Este parágrafo utiliza a classe destaque02
    </p>
</div>
<div class = caixa02>
    <p>Este paragrafo não utiliza nenhuma classe</p>
</div>
</body>
</html>
